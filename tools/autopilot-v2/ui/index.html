<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Control Center V2</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--ink:#e6edf3;--muted:#8b949e;--line:#30363d;
 --accent:#4f8ff7;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--pend:#6e7681;--radius:12px}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--panel:#fff;--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;
 --accent:#0969da;--ok:#1a7f37;--warn:#9a6700;--bad:#d1242f;--pend:#818b98}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700}.v2{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);
 border-radius:999px;padding:1px 8px}
nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:13.5px;padding:6px 10px;border-radius:8px;cursor:pointer}
nav button[aria-current="true"]{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px 14px 60px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
h1{font-size:18px;margin:0 0 6px}h2{font-size:14px;margin:0 0 10px}h3{font-size:12px;margin:12px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
p.sub{color:var(--muted);margin:0 0 12px;font-size:13.5px}
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px}
textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 15px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 13px;font:inherit;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.s-run{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.s-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.s-warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.s-idle{background:color-mix(in srgb,var(--pend) 20%,transparent);color:var(--muted)}
.tile{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.tile:first-of-type{border-top:0}.tile .t{font-weight:600;font-size:14px}.tile .m{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:5px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line)}th{color:var(--muted)}
.scroll{overflow-x:auto}
.note{font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--warn) 9%,transparent);
 border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);padding:9px 11px;border-radius:9px;margin:8px 0}
.empty{color:var(--muted);text-align:center;padding:24px;font-size:13.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.agents{display:grid;gap:10px}
.apane{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ahead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:color-mix(in srgb,var(--line) 40%,transparent);font-weight:700;font-size:12.5px;letter-spacing:.05em}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--pend)}
.live-dot.on{background:var(--ok);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.alog{max-height:420px;overflow-y:auto;padding:8px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.alog .t{color:var(--muted)}
.alog .k-thinking{color:var(--muted);font-style:italic}
.alog .k-tool{color:var(--accent)}
.alog .k-error{color:var(--bad)}
.alog .k-lifecycle{color:var(--warn)}
.newmsg{position:sticky;bottom:0;text-align:center}
.newmsg button{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:4px 14px;font-size:12px;cursor:pointer}
.finding{border:1px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px}
.decision{border:1px solid var(--warn);border-radius:10px;padding:12px;margin:10px 0}
.err{color:var(--bad);font-size:13px;min-height:18px}
.center{max-width:380px;margin:10vh auto}
pre.diff{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;overflow-x:auto;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;max-height:560px;overflow-y:auto}
/* Persian report content: UI chrome stays English/LTR; the report itself is fa/RTL. */
.fa-report{direction:rtl;text-align:right;unicode-bidi:plaintext;font-size:14.5px;line-height:2;font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif}
.fa-report h3{margin:16px 0 6px;font-size:15.5px}
.fa-report p{margin:4px 0}
.fa-report ul{margin:4px 0;padding-right:22px;padding-left:0}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:ui-monospace,Menlo,monospace;font-size:.9em;background:color-mix(in srgb,var(--line) 45%,transparent);border-radius:5px;padding:1px 5px;word-break:break-all}
.stcard{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}
.stcard .ic{font-size:26px;line-height:1.2}
.stcard.act{border-color:var(--warn)}
.repmeta{color:var(--muted);font-size:12px;margin-top:10px}
@media(max-width:560px){.kv{grid-template-columns:1fr}main{padding:12px 10px 54px}}
</style>
</head>
<body>
<header><div class="hrow">
  <span class="brand">AI Control Center</span><span class="v2">V2</span>
  <nav id="nav"></nav>
</div></header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
"use strict";
// Agent output is untrusted. Nothing is ever rendered as HTML: every value
// goes through textContent. No innerHTML anywhere in this file.
const $ = (t, attrs = {}, kids = []) => {
  const el = document.createElement(t);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = String(v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, String(v));
  }
  for (const k of [].concat(kids)) if (k) el.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
  return el;
};
const freshRep = () => ({ current:null, history:[], busy:false, msg:"", auto:false, timer:null, delta:null, loaded:false });
const state = { csrf:null, view:"home", taskId:null, tab:"live", tasks:[], legacy:[], sys:null, obs:null, detail:null, dep:null,
  es:null, lastId:0, autoscroll:true, filter:"all", search:"", mfa:{enrolled:false}, rep: freshRep(), modelMeta:null };

async function api(path, opts = {}) {
  const o = { headers: { "content-type": "application/json" }, ...opts };
  if (opts.body && state.csrf) o.headers["x-csrf-token"] = state.csrf;
  const r = await fetch(path, o);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ("request failed: " + r.status));
  return j;
}
const short = s => (s ? String(s).slice(0, 9) : "");
const fmt = t => { try { return new Date(t).toLocaleString(); } catch { return String(t); } };
const hhmmss = t => { try { return new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}); } catch { return ""; } };
const dur = ms => ms > 3600e3 ? (ms/3600e3).toFixed(1)+"h" : ms > 60e3 ? Math.round(ms/60e3)+"m" : Math.round(ms/1e3)+"s";
const SC = s => ["DEPLOYED","MERGED","READY_TO_MERGE","READY_TO_DEPLOY"].includes(s) ? "s-ok"
  : ["ESCALATED","FAILED"].includes(s) ? "s-bad"
  : ["AWAITING_HUMAN","PAUSED_RATE_LIMIT","PAUSED"].includes(s) ? "s-warn"
  : ["CANCELLED","NEW"].includes(s) ? "s-idle" : "s-run";

// ---- ROUTING --------------------------------------------------------------
// The URL is the source of truth for which view is shown, so browser back and
// forward, reload, and shared deep links all work. Navigation goes through
// go(); popstate replays a URL WITHOUT pushing a new entry (that would trap
// the user in the history stack).
const TASK_TABS = ["overview","live","design","findings","tests","evidence","diff","report"];

function urlFor(st) {
  if (st.view === "task") return "/tasks/" + st.taskId + (st.tab && st.tab !== "overview" ? "/" + st.tab : "");
  if (st.view === "legacy") return "/legacy/" + st.taskId;
  if (st.view === "obs") return "/observatory";
  if (st.view === "system") return "/system";
  return "/";
}
function parseUrl(pathname) {
  let m = /^\/tasks\/(TASK-V2-\d+)(?:\/([a-z]+))?$/.exec(pathname);
  if (m) return { view: "task", taskId: m[1], tab: TASK_TABS.includes(m[2]) ? m[2] : "overview" };
  m = /^\/legacy\/(TASK-\d+)$/.exec(pathname);
  if (m) return { view: "legacy", taskId: m[1], tab: null };
  if (pathname === "/observatory") return { view: "obs", taskId: null, tab: null };
  if (pathname === "/system") return { view: "system", taskId: null, tab: null };
  return { view: "home", taskId: null, tab: null };
}

/** Enter a route: update history (unless replaying), then apply it. */
function go(target, opts = {}) {
  const url = urlFor(target);
  if (!opts.replay) {
    if (url === location.pathname) history.replaceState(target, "", url);
    else history.pushState(target, "", url);
  }
  applyRoute(target);
}

/** Make the app match a route. Only tears down streams on a real task switch. */
function applyRoute(r) {
  const sameTask = state.view === r.view && state.taskId === r.taskId;
  if (!sameTask) {
    if (state.rep.timer) clearInterval(state.rep.timer);
    state.rep = freshRep();
    state.detail = null; state.lastId = 0;
    for (const k of Object.keys(paneBufs)) delete paneBufs[k];
    if (state.es) { state.es.close(); state.es = null; }
  }
  state.view = r.view;
  state.taskId = r.taskId;
  if (r.view === "task") state.tab = r.tab || "overview";
  render();

  if (r.view === "task") {
    if (!sameTask) { loadTask(r.taskId); openStream(r.taskId); }
    if (state.tab === "diff") loadDiff();
    if (state.tab === "report") initReportTab(r.taskId);
  } else if (r.view === "legacy") {
    if (!sameTask) loadReports(r.taskId).then(() => {
      if (state.taskId !== r.taskId) return;
      if (!state.rep.current && state.rep.history.length) state.rep.current = state.rep.history[state.rep.history.length - 1];
      render();
    });
  } else if (r.view === "obs") loadObs();
  else if (r.view === "system") loadSys();
}

window.addEventListener("popstate", (e) => {
  // Back/forward: honour the URL the browser moved to; never push.
  applyRoute(e.state && e.state.view ? e.state : parseUrl(location.pathname));
});

// ---- HOME -----------------------------------------------------------------
function viewHome() {
  const m = $("div");
  const c = $("div", { class: "card" });
  c.appendChild($("h1", { text: "What do you want the AI team to do?" }));
  c.appendChild($("p", { class: "sub", text: "Describe it and leave. The system designs, reviews, implements, tests, gathers evidence, and merges/deploys when policy allows. You are asked only for genuinely critical decisions." }));
  const ta = $("textarea", { placeholder: "e.g. Fix invoice tax calculation rounding for multi-currency invoices." });
  c.appendChild(ta);
  let risk = "medium";
  const seg = $("div", { class: "seg", style: "margin-top:10px" });
  ["low","medium","high"].forEach(r => {
    const b = $("button", { type:"button", text:r.toUpperCase(), "aria-pressed":String(r===risk) });
    b.onclick = () => { risk = r; [...seg.children].forEach(x => x.setAttribute("aria-pressed", String(x===b))); };
    seg.appendChild(b);
  });
  const err = $("div", { class: "err" });

  // Advanced (collapsed): optional per-task model overrides. The default path
  // stays a plain textarea + Start; the snapshot records whatever is chosen.
  const adv = $("details", { style: "margin-top:10px" });
  adv.appendChild($("summary", { style: "cursor:pointer;color:var(--muted);font-size:13px", text: "Advanced" }));
  const advBody = $("div", { style: "margin-top:8px" });
  const useDefaults = $("input", { type: "checkbox", style: "width:auto" });
  useDefaults.checked = true;
  advBody.appendChild($("label", { class: "row", style: "font-size:13.5px" },
    [useDefaults, $("span", { text: "Use default AI models" })]));
  const ovBox = $("div", { style: "display:none;margin-top:8px" });
  const ovSelects = {};
  const buildOverrides = () => {
    ovBox.textContent = "";
    const mm = state.modelMeta;
    if (!mm) { ovBox.appendChild($("div", { class: "empty", text: "Loading model list…" })); loadModelMeta().then(() => { if (!useDefaults.checked) { buildOverrides(); } }); return; }
    for (const role of mm.roles) {
      const provKey = role.provider === "codex" ? "codex" : "claude";
      const avail = Object.entries(mm.settings.providers[provKey].models).filter(([,v]) => v.available).map(([k]) => k);
      const row = $("div", { class: "row", style: "margin-top:6px" });
      row.appendChild($("span", { style: "min-width:230px;font-size:12.5px;color:var(--muted)", text: role.group + " — " + role.label }));
      const sel = $("select", { style: "max-width:220px" });
      sel.appendChild($("option", { value: "", text: "Default (" + mm.settings.roles[role.id].model + ")", selected: true }));
      for (const mdl of avail) sel.appendChild($("option", { value: mdl, text: mdl }));
      ovSelects[role.id] = sel;
      row.appendChild(sel);
      ovBox.appendChild(row);
    }
  };
  useDefaults.onchange = () => { ovBox.style.display = useDefaults.checked ? "none" : "block"; if (!useDefaults.checked) buildOverrides(); };
  advBody.appendChild(ovBox);
  adv.appendChild(advBody);

  const go = $("button", { class: "btn", text: "Start" });
  go.onclick = async () => {
    err.textContent = "";
    if (!ta.value.trim()) { err.textContent = "Describe the task first."; return; }
    go.disabled = true;
    try {
      let modelOverrides;
      if (!useDefaults.checked) {
        modelOverrides = {};
        for (const [rid, sel] of Object.entries(ovSelects)) if (sel.value) modelOverrides[rid] = { model: sel.value };
        if (!Object.keys(modelOverrides).length) modelOverrides = undefined;
      }
      const r = await api("/api/v2/tasks", { method: "POST",
        body: JSON.stringify({ description: ta.value.trim(), risk, modelOverrides }) });
      ta.value = ""; await refresh(); goTask(r.taskId);
    } catch (e) { err.textContent = e.message; }
    go.disabled = false;
  };
  c.appendChild($("div", { class: "row", style: "margin-top:10px" }, [seg, go]));
  c.appendChild(adv);
  c.appendChild(err);
  m.appendChild(c);

  if (state.dep) {
    const on = state.dep.automaticProductionDeployment;
    m.appendChild($("div", { class: "card row" }, [
      $("span", { style: "font-weight:700;letter-spacing:.03em", text: "AUTOMATIC DEPLOYMENT" }),
      $("span", { class: "pill " + (on ? "s-ok" : "s-warn"), text: on ? "● ENABLED" : "● PAUSED" }),
      $("span", { class: "m", style: "color:var(--muted);font-size:12.5px", text: on
        ? "eligible tasks deploy automatically after all policy gates"
        : "tasks stop at READY_TO_DEPLOY — change under System → Deployment Settings" }),
    ]));
  }
  if (!state.mfa.enrolled) m.appendChild($("div", { class: "note", text: "MFA NOT CONFIGURED — enroll on the System page to require a TOTP code for merge/deploy approvals." }));

  const groups = [
    ["Running", t => ["DESIGN","IMPLEMENT","VERIFY","REVIEW","FIX","FINAL_ACCEPTANCE","NEW"].includes(t.state)],
    ["Awaiting Human", t => t.state === "AWAITING_HUMAN"],
    ["Ready to Merge", t => t.state === "READY_TO_MERGE"],
    ["Ready to Deploy", t => t.state === "READY_TO_DEPLOY"],
    ["Paused", t => t.state === "PAUSED_RATE_LIMIT" || t.state === "PAUSED"],
    ["Recently Completed", t => ["DEPLOYED","MERGED","ESCALATED","FAILED","CANCELLED"].includes(t.state)],
  ];
  for (const [label, pred] of groups) {
    const items = state.tasks.filter(pred);
    if (!items.length) continue;
    const g = $("div", { class: "card" }, [$("h2", { text: label })]);
    items.slice(0, 8).forEach(t => g.appendChild(tile(t)));
    m.appendChild(g);
  }
  if (state.legacy.length) {
    const g = $("div", { class: "card" }, [$("h2", { text: "V1 Legacy (read-only)" })]);
    state.legacy.slice(0, 6).forEach(t => g.appendChild($("div", { class: "tile", onclick: () => goLegacy(t.taskId) }, [
      $("div", {}, [$("div", { class:"t", text: t.taskId + " · " + t.title }),
        $("div", { class:"m", text: "V1 LEGACY · " + t.events + " events · click for Persian report" })]),
      $("span", { class: "pill s-idle", text: t.state }),
    ])));
    m.appendChild(g);
  }
  return m;
}
function tile(t) {
  return $("div", { class: "tile", onclick: () => goTask(t.taskId) }, [
    $("div", {}, [
      $("div", { class: "t", text: t.taskId + " · " + t.title }),
      $("div", { class: "m", text: `${t.risk} · ${t.phase || t.state} ${t.subPhase ? "/ "+t.subPhase : ""} · ${dur(t.elapsedMs)}` }),
    ]),
    $("span", { class: "pill " + SC(t.state), text: t.state.replace(/_/g," ") }),
  ]);
}

// ---- TASK -----------------------------------------------------------------
// Cross-task isolation and stream setup live in applyRoute, so every entry
// point — click, deep link, back button — takes exactly the same path.
function goTask(id) { go({ view: "task", taskId: id, tab: "live" }); }
function goLegacy(id) { go({ view: "legacy", taskId: id, tab: null }); }

async function loadTask(id) {
  try {
    const d = await api("/api/v2/tasks/" + id);
    if (state.taskId !== id) return; // stale response from a previous task
    state.detail = d; render();
  } catch { /* transient */ }
}

function openStream(id) {
  if (state.es) { state.es.close(); state.es = null; }
  state.lastId = 0;
  const es = new EventSource(`/api/v2/tasks/${id}/stream`);
  state.es = es;
  es.addEventListener("chunk", (e) => {
    const c = JSON.parse(e.data);
    state.lastId = c.id;
    appendChunk(c);
  });
  es.onerror = () => { /* EventSource reconnects with Last-Event-ID automatically */ };
}

const paneBufs = {};   // agent -> array of chunks (bounded)
function appendChunk(c) {
  const key = c.agent;
  (paneBufs[key] = paneBufs[key] || []).push(c);
  if (paneBufs[key].length > 3000) paneBufs[key].splice(0, 500);
  const pane = document.getElementById("alog-" + key);
  if (pane && (state.filter === "all" || state.filter === key) && matchesSearch(c)) {
    pane.appendChild(chunkLine(c));
    maybeScroll(pane);
  }
  const dot = document.getElementById("dot-" + key);
  if (dot) { dot.classList.add("on"); clearTimeout(dot._t); dot._t = setTimeout(() => dot.classList.remove("on"), 5000); }
  if (c.kind === "lifecycle" && /state:/.test(c.text)) loadTask(state.taskId);
  if (c.kind === "report") loadReports(state.taskId).then(() => {
    if (!state.rep.current && state.rep.history.length)
      state.rep.current = state.rep.history[state.rep.history.length - 1];
    if (state.tab === "report") render();
  });
}
function matchesSearch(c) { return !state.search || c.text.toLowerCase().includes(state.search.toLowerCase()); }
function chunkLine(c) {
  return $("div", { class: "k-" + c.kind }, [
    $("span", { class: "t", text: hhmmss(c.ts) + " " }), c.text,
  ]);
}
function maybeScroll(pane) {
  if (state.autoscroll) pane.scrollTop = pane.scrollHeight;
  else {
    const btn = pane.parentElement.querySelector(".newmsg");
    if (btn) btn.style.display = "block";
  }
}

function viewTask() {
  const t = state.detail;
  const m = $("div");
  if (!t) { m.appendChild($("div", { class: "card empty", text: "Loading…" })); return m; }

  const head = $("div", { class: "card" });
  head.appendChild($("div", { class: "row" }, [
    $("h1", { text: t.taskId, style: "margin:0" }),
    $("span", { class: "pill " + SC(t.state), text: t.state.replace(/_/g," ") }),
    $("span", { class: "pill s-idle", text: t.risk.toUpperCase() }),

// ---- PERSIAN REPORT -------------------------------------------------------
// Buttons and chrome are English; report CONTENT is Persian RTL. The narrative
// is plain text rendered via textContent only — never HTML. Technical tokens
// arrive `backtick`-wrapped from the server and become isolated LTR spans.
function faInline(parent, text) {
  String(text).split("`").forEach((part, i) => {
    if (!part) return;
    if (i % 2) { parent.appendChild($("span", { class: "ltr", text: part })); return; }
    part.split(/\*\*([^*]+)\*\*/).forEach((b, j) => {
      if (b) parent.appendChild(j % 2 ? $("strong", { text: b }) : document.createTextNode(b));
    });
  });
}
function faBlock(md) {
  const root = $("div", { class: "fa-report", lang: "fa", dir: "rtl" });
  let ul = null;
  for (const line of String(md).split("\n")) {
    if (/^#{2,4}\s+/.test(line)) { ul = null; const h = $("h3"); faInline(h, line.replace(/^#+\s+/, "")); root.appendChild(h); }
    else if (/^[-•]\s+/.test(line)) { if (!ul) { ul = $("ul"); root.appendChild(ul); } const li = $("li"); faInline(li, line.replace(/^[-•]\s+/, "")); ul.appendChild(li); }
    else if (!line.trim()) ul = null;
    else { ul = null; const pEl = $("p"); faInline(pEl, line); root.appendChild(pEl); }
  }
  return root;
}
async function loadReports(id) {

  const mfaIn = state.mfa.enrolled ? $("input",{placeholder:"MFA code",style:"max-width:130px"}) : null;
  const row = $("div",{class:"row",style:"margin-top:10px"});
  const approve = $("button",{class:"btn",text:"APPROVE RECOMMENDED ACTION"});
  approve.onclick = () => decide(t, d, "approve", mfaIn);
  const reject = $("button",{class:"btn sec",text:"Reject"});
  reject.onclick = () => decide(t, d, "reject", mfaIn);
  if (mfaIn) row.appendChild(mfaIn);
  row.appendChild(approve); row.appendChild(reject);
  c.appendChild(row);
  return c;
}
async function decide(t, d, choice, mfaIn) {
  try {
    await api(`/api/v2/tasks/${t.taskId}/decision`, { method:"POST",
      body: JSON.stringify({ decisionId: d.decisionId, choice, mfaCode: mfaIn?.value }) });
    loadTask(t.taskId);
  } catch (e) { alert(e.message); }
}

function approveCard(t, kind) {
  const c = $("div",{class:"decision"});
  c.appendChild($("h2",{text: kind === "merge" ? "Approve merge to main" : "Approve production deploy"}));
  c.appendChild($("dl",{class:"kv"},[
    $("dt",{text:"Reviewed SHA"}),$("dd",{class:"mono",text:t.headSha}),
    $("dt",{text:"Branch"}),$("dd",{class:"mono",text:t.branch}),
  ]));
  c.appendChild($("p",{class:"sub",text: kind === "merge"
    ? "The server verifies this exact SHA equals the reviewed HEAD and the branch HEAD before merging."
    : "Deploys origin/main via the audited deploy script (backup + rollback + health checks)."}));
  const mfaIn = state.mfa.enrolled ? $("input",{placeholder:"MFA code",style:"max-width:130px"}) : null;
  const btn = $("button",{class:"btn",text: kind === "merge" ? "Approve merge" : "Approve deploy"});
  btn.onclick = async () => {
    btn.disabled = true;
    try {
      await api(`/api/v2/tasks/${t.taskId}/approve-${kind}`, { method:"POST",
        body: JSON.stringify({ approvedSha: t.headSha, mfaCode: mfaIn?.value }) });
      loadTask(t.taskId);
    } catch (e) { alert(e.message); }
    btn.disabled = false;
  };
  const row = $("div",{class:"row"});
  if (mfaIn) row.appendChild(mfaIn);
  row.appendChild(btn);
  c.appendChild(row);
  return c;
}

// ---- OBSERVATORY / SYSTEM -------------------------------------------------
function viewObservatory() {
  const m = $("div");
  const o = state.obs;
  if (!o) { m.appendChild($("div",{class:"card empty",text:"Loading…"})); return m; }
  const c = $("div",{class:"card"},[$("h1",{text:"Observatory"})]);
  if (o.note) c.appendChild($("div",{class:"note",text:o.note}));
  const tb = $("table");
  tb.appendChild($("tr",{},[["Task","Evidence","State","Findings","Adjudications","Deterministic overrules"].map(h=>$("th",{text:h}))].flat()));
  (o.tasks||[]).forEach(t => tb.appendChild($("tr",{},[
    $("td",{class:"mono",text:t.taskId}),
    $("td",{},[$("span",{class:"pill s-ok",text:t.provenance})]),
    $("td",{text:t.state||""}),
    $("td",{text:String(t.findings)}), $("td",{text:String(t.adjudications)}), $("td",{text:String(t.deterministicOverrules)}),
  ])));
  c.appendChild($("div",{class:"scroll"},[tb]));
  c.appendChild($("p",{class:"sub",style:"margin-top:10px",text:`${o.legacy} V1 legacy task(s) visible read-only under Home.`}));
  m.appendChild(c);
  return m;
}

function viewSystem() {
  const m = $("div");
  const s = state.sys;
  if (!s) { m.appendChild($("div",{class:"card empty",text:"Loading…"})); return m; }
  const c = $("div",{class:"card"},[$("h1",{text:"System"})]);
  c.appendChild($("dl",{class:"kv"},[
    $("dt",{text:"Control plane"}),$("dd",{text:"V2 @ "+s.sha}),
    $("dt",{text:"Billing"}),$("dd",{text:s.billingMode + (s.paidApiKeys.length?" — PAID KEYS PRESENT!":" (no paid keys)")}),
    $("dt",{text:"Claude"}),$("dd",{text:s.claude}),
    $("dt",{text:"Codex"}),$("dd",{text:s.codex}),
    $("dt",{text:"Stage -1 lock"}),$("dd",{text:s.stage1Lock||"free"}),
    $("dt",{text:"Redaction"}),$("dd",{text:s.redactionRules+" known env values + pattern rules"}),
    $("dt",{text:"State root"}),$("dd",{class:"mono",text:s.stateRoot}),
    $("dt",{text:"Active tasks"}),$("dd",{text:(s.activeTasks||[]).join(", ")||"none"}),
    $("dt",{text:"Disk"}),$("dd",{text:s.disk}),
    $("dt",{text:"Memory"}),$("dd",{text:s.memory}),
    $("dt",{text:"Load"}),$("dd",{text:s.load}),
  ]));
  c.appendChild($("h3",{text:"Production"}));
  (s.production||[]).forEach(l => c.appendChild($("div",{class:"mono",style:"font-size:12px",text:l})));
  m.appendChild(c);

  const dep = $("div",{class:"card"},[$("h2",{text:"Deployment Settings"})]);
  if (state.dep) {
    const on = state.dep.automaticProductionDeployment;
    dep.appendChild($("div",{class:"row"},[
      $("span",{style:"font-weight:700",text:"Automatic Production Deployment"}),
      $("span",{class:"pill "+(on?"s-ok":"s-warn"),text:on?"● ENABLED":"● PAUSED"}),
    ]));
    dep.appendChild($("p",{class:"sub",style:"margin-top:6px",text:on
      ? "ON — Autopilot may deploy automatically after all deployment policy gates pass (backup, rollback, preflight, health, no CRITICAL findings). The toggle bypasses none of them."
      : "OFF — all automatic production deployments stop at READY_TO_DEPLOY."}));
    dep.appendChild($("div",{class:"mono",style:"font-size:11.5px;color:var(--muted)",
      text:`technical: AI_V2_HOLD_DEPLOY=${on?0:1} · source: ${state.dep.source}` +
        (state.dep.updatedBy?` · last changed by ${state.dep.updatedBy} at ${fmt(state.dep.updatedAt)}`:"")}));
    if (state.dep.activeDeployment) {
      dep.appendChild($("div",{class:"note",text:"A deployment is already in progress and will finish safely — the toggle never interrupts an executing deploy: "+state.dep.activeDeployment}));
    }
    const ready = state.dep.readyToDeploy || [];
    if (!on && ready.length) {
      dep.appendChild($("div",{class:"note",text:`${ready.length} task(s) waiting at READY_TO_DEPLOY: ${ready.join(", ")}`}));
    }
    const cont = $("input",{type:"checkbox",style:"width:auto",checked:true,id:"dep-cont"});
    const contRow = $("label",{class:"row",style:"margin-top:10px;font-size:13px;display:"+(on?"none":"flex")},[
      cont, $("span",{text:"Automatically continue currently READY_TO_DEPLOY tasks when enabling"}),
    ]);
    dep.appendChild(contRow);
    const btn = $("button",{class:"btn "+(on?"danger":""),style:"margin-top:10px",
      text:on?"Turn OFF automatic deployment":"Turn ON automatic deployment"});
    btn.onclick = async () => {
      const next = !on;
      if (!confirm(next
        ? "Enable automatic production deployment? Eligible tasks will deploy without further approval once every policy gate passes."
        : "Pause automatic production deployment? New deployments stop at READY_TO_DEPLOY; an executing deployment finishes safely.")) return;
      btn.disabled = true;
      try {
        state.dep = await api("/api/v2/settings/deployment",{method:"PATCH",
          body:JSON.stringify({automaticProductionDeployment:next, continueReadyTasks: next ? cont.checked : undefined})});
        render();
      } catch (e) { alert(e.message); btn.disabled = false; }
    };
    dep.appendChild(btn);
  } else dep.appendChild($("div",{class:"empty",text:"Loading…"}));
  m.appendChild(dep);

  m.appendChild(aiModelsCard());

  const mfa = $("div",{class:"card"},[$("h2",{text:"MFA"})]);
  if (s.mfa.enrolled) mfa.appendChild($("p",{class:"sub",text:"TOTP enrolled. Merge/deploy/decision approvals require a valid code."}));
  else {
    mfa.appendChild($("div",{class:"note",text:"MFA NOT CONFIGURED"}));
    const b = $("button",{class:"btn",text:"Enroll TOTP"});
    const out = $("div",{class:"mono",style:"margin-top:8px;word-break:break-all;font-size:12px"});
    const codeIn = $("input",{placeholder:"6-digit code from your app",style:"max-width:220px;margin-top:8px"});
    const confirm2 = $("button",{class:"btn sec",text:"Confirm",style:"margin-top:8px"});
    b.onclick = async () => {
      const r = await api("/api/v2/mfa/enroll",{method:"POST",body:"{}"});
      out.textContent = "Add to your authenticator: " + r.otpauth + "   (manual secret: " + r.secret + ")";
    };
    confirm2.onclick = async () => {
      try { await api("/api/v2/mfa/confirm",{method:"POST",body:JSON.stringify({code:codeIn.value})}); await boot(); }
      catch { alert("invalid code"); }
    };
    mfa.appendChild(b); mfa.appendChild(out); mfa.appendChild(codeIn); mfa.appendChild(confirm2);
  }
  m.appendChild(mfa);
  return m;
}

// ---- AI MODELS (System) ---------------------------------------------------
async function loadModelMeta() {
  try { state.modelMeta = await api("/api/v2/settings/models"); } catch { /* transient */ }
}
async function patchModel(body, btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await api("/api/v2/settings/models", { method: "PATCH", body: JSON.stringify(body) });
    state.modelMeta = { ...state.modelMeta, settings: r.settings };
    render();
  } catch (e) { alert(e.message); if (btn) btn.disabled = false; }
}
function aiModelsCard() {
  const c = $("div", { class: "card" }, [$("h2", { text: "AI Models" })]);
  const mm = state.modelMeta;
  if (!mm) {
    c.appendChild($("div", { class: "empty", text: "Loading…" }));
    if (!aiModelsCard._loading) {
      aiModelsCard._loading = true;
      loadModelMeta().then(() => { aiModelsCard._loading = false; if (state.modelMeta) render(); });
    }
    return c;
  }
  const s = mm.settings;
  c.appendChild($("p", { class: "sub", text: "Per-role model selection. Only models verified against the subscription-authenticated CLIs are selectable. A role's provider is fixed — reviewer independence is structural." }));

  // Presets: they FILL the role settings below, never hide them.
  const prow = $("div", { class: "row", style: "margin:8px 0" });
  for (const pr of (mm.presets || [])) {
    const b = $("button", { class: "btn sec", text: pr.replace(/-/g, " ").replace(/\b\w/g, ch => ch.toUpperCase()) });
    b.onclick = () => { if (confirm(`Apply preset "${pr}" to all roles? Each role's selector below will show the result.`)) patchModel({ preset: pr }, b); };
    prow.appendChild(b);
  }
  const refresh = $("button", { class: "btn sec", text: mm.refreshing ? "Probing models…" : "Refresh Models" });
  refresh.disabled = !!mm.refreshing;
  refresh.onclick = async () => {
    refresh.disabled = true; refresh.textContent = "Probing models…";
    try {
      await api("/api/v2/settings/models/refresh", { method: "POST", body: "{}" });
      const before = mm.settings.updatedAt;
      // The probes run in the background on the server; poll until they land.
      const poll = setInterval(async () => {
        await loadModelMeta();
        if (state.modelMeta && state.modelMeta.settings.updatedAt !== before && !state.modelMeta.refreshing) {
          clearInterval(poll); render();
        }
      }, 5000);
      setTimeout(() => clearInterval(poll), 10 * 60000);
    } catch (e) { alert(e.message); refresh.disabled = false; refresh.textContent = "Refresh Models"; }
  };
  prow.appendChild(refresh);
  c.appendChild(prow);
  c.appendChild($("p", { class: "sub", text: "Refresh Models probes each candidate with a tiny real request through the subscription CLI (server-owned commands only) — availability reflects reality, not a hard-coded list." }));

  const provInfo = {
    "CLAUDE": { key: "claude", provider: "claude" },
    "CLAUDE CODE": { key: "claude", provider: "claude-code" },
    "CODEX": { key: "codex", provider: "codex" },
  };
  for (const [group, gi] of Object.entries(provInfo)) {
    const ps = s.providers[gi.key];
    const avail = Object.entries(ps.models).filter(([,v]) => v.available).map(([k]) => k);
    const sec = $("div", { style: "margin-top:14px;border-top:1px solid var(--line);padding-top:10px" });
    sec.appendChild($("div", { class: "row" }, [
      $("h3", { text: group, style: "margin:0" }),
      $("span", { class: "pill " + (ps.connected ? "s-ok" : "s-bad"), text: ps.connected ? "Connected" : "Unavailable" }),
      $("span", { class: "m", style: "color:var(--muted);font-size:12px", text: `CLI ${ps.cliVersion} · Auth: ${ps.authMode}` }),
    ]));
    for (const role of mm.roles.filter(r => r.provider === gi.provider)) {
      const rs = s.roles[role.id];
      const row = $("div", { class: "row", style: "margin-top:8px;flex-wrap:wrap" });
      row.appendChild($("span", { style: "min-width:190px;font-size:13.5px", text: role.label }));

      const msel = $("select", { style: "max-width:220px" });
      for (const mdl of avail) {
        const o = $("option", { value: mdl, text: mdl });
        if (mdl === rs.model) o.selected = true;
        msel.appendChild(o);
      }
      if (!avail.includes(rs.model)) msel.appendChild($("option", { value: rs.model, text: rs.model + " (unverified)", selected: true }));
      msel.onchange = () => patchModel({ role: role.id, model: msel.value });
      row.appendChild(msel);

      const rsel = $("select", { style: "max-width:150px" });
      rsel.appendChild($("option", { value: "", text: "Reasoning: default", selected: !rs.reasoning }));
      for (const lv of (mm.reasoning[gi.key] || [])) {
        const o = $("option", { value: lv, text: "Reasoning: " + lv });
        if (lv === rs.reasoning) o.selected = true;
        rsel.appendChild(o);
      }
      rsel.onchange = () => patchModel({ role: role.id, reasoning: rsel.value || null });
      row.appendChild(rsel);

      const fsel = $("select", { style: "max-width:230px" });
      const fopts = [["best-available", "Fallback: best available (same provider)"], ["pause", "Fallback: pause task"]];
      for (const mdl of avail) if (mdl !== rs.model) fopts.push(["backup:" + mdl, "Fallback: backup " + mdl]);
      for (const [v, label] of fopts) {
        const o = $("option", { value: v, text: label });
        if (v === rs.fallback) o.selected = true;
        fsel.appendChild(o);
      }
      fsel.onchange = () => patchModel({ role: role.id, fallback: fsel.value });
      row.appendChild(fsel);

      const av = ps.models[rs.model];
      if (av) row.appendChild($("span", { class: "m", style: "color:var(--muted);font-size:11.5px",
        text: `${av.available ? "verified" : "UNVERIFIED"} ${fmt(av.lastChecked)}` + (av.effectiveModel && av.effectiveModel !== rs.model ? ` · effective: ${av.effectiveModel}` : "") }));
      sec.appendChild(row);
    }
    sec.appendChild($("div", { class: "mono", style: "font-size:11px;color:var(--muted);margin-top:6px",
      text: "models: " + Object.entries(ps.models).map(([k, v]) => `${k}${v.available ? " ✓" : " ✗"}`).join("  ") }));
    c.appendChild(sec);
  }
  c.appendChild($("div", { class: "mono", style: "font-size:11px;color:var(--muted);margin-top:10px",
    text: `stored at state-v2/settings/models.json · last change: ${s.updatedBy} at ${fmt(s.updatedAt)} · billing: SUBSCRIPTION_CLI_ONLY (no paid API fallback)` }));
  return c;
}

// ---- login / shell --------------------------------------------------------
function viewLogin() {
  const c = $("div",{class:"card center"});
  c.appendChild($("h1",{text:"Sign in"}));
  const u = $("input",{placeholder:"Username",autocomplete:"username"});
  const pw = $("input",{type:"password",placeholder:"Password",autocomplete:"current-password",style:"margin-top:8px"});
  const err = $("div",{class:"err"});
  const btn = $("button",{class:"btn",text:"Sign in",style:"width:100%;margin-top:10px"});
  const submit = async () => {
    err.textContent = ""; btn.disabled = true;
    try {
      const r = await api("/api/v2/login",{method:"POST",body:JSON.stringify({username:u.value,password:pw.value})});
      state.csrf = r.csrf; await boot();
    } catch (e) { err.textContent = e.message; btn.disabled = false; }
  };
  btn.onclick = submit; pw.onkeydown = e => { if (e.key === "Enter") submit(); };
  c.appendChild(u); c.appendChild(pw); c.appendChild(btn); c.appendChild(err);
  return c;
}

function render() {
  const nav = document.getElementById("nav");
  nav.textContent = "";
  [["home","Home"],["obs","Observatory"],["system","System"]].forEach(([v,label]) => {
    const b = $("button",{text:label,"aria-current":String(state.view===v)});
    b.onclick = () => go({ view: v, taskId: null, tab: null });
    nav.appendChild(b);
  });
  const out = $("button",{text:"Sign out"});
  out.onclick = async () => { await api("/api/v2/logout",{method:"POST",body:"{}"}).catch(()=>{}); location.href = "/"; };
  nav.appendChild(out);
  const main = document.getElementById("main");
  main.textContent = "";
  main.appendChild(
    state.view === "task" ? viewTask() :
    state.view === "legacy" ? viewLegacy() :
    state.view === "obs" ? viewObservatory() :
    state.view === "system" ? viewSystem() : viewHome());
}

async function refresh() {
  try {
    const t = await api("/api/v2/tasks");
    state.tasks = t.tasks; state.legacy = t.legacy || [];
    if (state.view === "home") render();
  } catch { /* transient */ }
}
async function loadObs() { try { state.obs = await api("/api/v2/observatory"); render(); } catch {} }
async function loadSys() { try { state.sys = await api("/api/v2/system"); state.dep = await api("/api/v2/settings/deployment"); await loadModelMeta(); render(); } catch {} }

async function boot() {
  const s = await api("/api/v2/session");
  state.mfa = s.mfa || {enrolled:false};
  if (!s.authenticated) {
    document.getElementById("nav").textContent = "";
    const main = document.getElementById("main");
    main.textContent = ""; main.appendChild(viewLogin());
    return;
  }
  state.csrf = s.csrf;
  try { state.dep = await api("/api/v2/settings/deployment"); } catch { /* first paint without it */ }
  loadModelMeta().then(() => { if (state.view !== "home") render(); }); // non-blocking
  await refresh();
  // Honour the URL we were opened with (deep link, reload, restored tab) and
  // seed history.state so the first back/forward has something to replay.
  const initial = parseUrl(location.pathname);
  history.replaceState(initial, "", urlFor(initial));
  applyRoute(initial);
  setInterval(refresh, 15000);
}
boot().catch(e => { document.getElementById("main").textContent = "Failed to start: " + e.message; });
</script>
</body>
